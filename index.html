<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LimDs Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans JP', 'Inter', sans-serif;
      background: #f8f4ee;
      color: #2a2520;
      min-height: 100vh;
    }

    /* ===== ナビゲーション ===== */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #f8f4ee;
      border-bottom: 3px solid #f4c121;
      height: 56px;
      padding: 0 2.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .nav-logo {
      width: 80px;
      display: flex;
      align-items: center;
    }
    .nav-logo svg {
      width: 100%;
      height: auto;
    }
    .nav-logo path,
    .nav-logo polygon,
    .nav-logo polyline,
    .nav-logo rect {
      fill: #2a2520;
      stroke: #2a2520;
    }
    .nav-links {
      display: flex;
      gap: 2rem;
    }
    .nav-links a {
      font-size: 12px;
      color: #aaa8a0;
      text-decoration: none;
      letter-spacing: 0.06em;
      transition: color 0.15s, border-color 0.15s;
      padding-bottom: 2px;
      border-bottom: 2px solid transparent;
    }
    .nav-links a:hover {
      color: #2a2520;
    }
    .nav-links a.active {
      color: #2a2520;
      border-bottom: 2px solid #f4c121;
    }

    /* ===== メインコンテンツ ===== */
    .main { width: 100%; }

    /* ===== セクション共通 ===== */
    .section { display: none; }
    .section.active { display: block; }

    /* ===== FV ===== */
    .fv {
      min-height: calc(100vh - 56px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      padding: 4rem 2rem;
    }
    .fv-card {
      background: #f4c121;
      border-radius: 4px;
      padding: 3rem 4rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .fv-logo {
      width: 280px;
      max-width: 70vw;
      margin-bottom: 8px;
    }
    .fv-logo svg { width: 100%; height: auto; }
    .fv-logo path,
    .fv-logo polygon,
    .fv-logo polyline,
    .fv-logo rect {
      fill: #2a2520;
      stroke: #2a2520;
    }
    .fv-title {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #2a2520;
    }
    .fv-sub {
      font-size: 11px;
      letter-spacing: 0.1em;
      color: #5a5040;
    }
    .fv-divider {
      width: 40px;
      height: 2px;
      background: #f4c121;
    }
    .scroll-hint {
      margin-top: 2rem;
      font-size: 10px;
      letter-spacing: 0.15em;
      color: #ccc8c0;
      text-transform: uppercase;
      animation: fadeUpDown 2s ease-in-out infinite;
    }
    @keyframes fadeUpDown {
      0%, 100% { opacity: 0.4; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(4px); }
    }

    /* ===== PORTFOLIO ===== */
    .portfolio-section {
      padding: 4rem 2.5rem;
    }
    .section-label {
      font-size: 10px;
      letter-spacing: 0.2em;
      color: #ccc8c0;
      text-transform: uppercase;
      margin-bottom: 2rem;
      text-align: center;
    }
    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }
    .work-card {
      background: #ece8e0;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #e0dbd0;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .work-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(42,37,32,0.08);
    }
    .work-card img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      display: block;
    }
    .work-card-placeholder {
      width: 100%;
      aspect-ratio: 4/3;
      background: #e4e0d8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #ccc8c0;
    }
    .more-btn {
      display: block;
      margin: 2.5rem auto 0;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #aaa8a0;
      background: transparent;
      border: 1px solid #ddd8ce;
      padding: 10px 32px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .more-btn:hover {
      background: #ece8e0;
      color: #2a2520;
    }

    /* ===== ライトボックス ===== */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(42,37,32,0.9);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .lightbox.open { display: flex; }
    .lightbox-inner {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .lightbox img {
      max-width: 80vw;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 4px;
    }
    .lb-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      color: #fff;
      font-size: 20px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .lb-btn:hover { background: rgba(255,255,255,0.25); }
    .lb-close {
      position: absolute;
      top: -44px;
      right: 0;
      background: none;
      border: none;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
      line-height: 1;
      opacity: 0.7;
    }
    .lb-close:hover { opacity: 1; }

    /* ===== PROFILE ===== */
    .profile-section { padding: 4rem 2.5rem; max-width: 640px; margin: 0 auto; }
    .profile-card {
      background: #f4c121;
      border-radius: 4px;
      border: none;
      padding: 2rem;
    }
    .profile-name { font-size: 18px; font-weight: 500; margin-bottom: 0.5rem; color: #2a2520; }
    .profile-bio { font-size: 13px; color: #3a3028; line-height: 1.8; margin-bottom: 1.5rem; }
    .profile-block { margin-bottom: 1.5rem; }
    .profile-block h3 {
      font-size: 10px;
      letter-spacing: 0.15em;
      color: #6a5a30;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
    }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      font-size: 11px;
      background: #f8f4ee;
      color: #3a3028;
      padding: 3px 12px;
      border-radius: 20px;
      border: 1px solid #e8e2d8;
    }
    .history-list { list-style: none; }
    .history-list li {
      font-size: 13px;
      color: #3a3028;
      padding: 8px 0;
      border-bottom: 1px solid rgba(42,37,32,0.15);
      display: flex;
      gap: 1.5rem;
    }
    .history-list li span:first-child { color: #6a5a30; font-size: 12px; min-width: 60px; }

    /* ===== CONTACT ===== */
    .contact-section {
      padding: 4rem 2.5rem;
      max-width: 480px;
      margin: 0 auto;
      text-align: center;
    }
    .contact-card {
      background: #f4c121;
      border-radius: 4px;
      padding: 3rem 2rem;
    }
    .contact-card p { font-size: 13px; color: #3a3028; line-height: 1.8; margin-bottom: 1.5rem; }
    .section-label {
      font-size: 10px;
      letter-spacing: 0.2em;
      color: #888078;
      text-transform: uppercase;
      margin-bottom: 2rem;
      text-align: center;
    }
    .contact-section p { font-size: 13px; color: #888078; line-height: 1.8; margin-bottom: 1.5rem; }
    .contact-btn {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #2a2520;
      border: 1px solid rgba(42,37,32,0.3);
      padding: 12px 32px;
      border-radius: 4px;
      text-decoration: none;
      background: #f4c121;
      transition: all 0.15s;
    }
    .contact-btn:hover { background: rgba(255,255,255,0.7); }

    /* ===== レスポンシブ ===== */
    @media (max-width: 680px) {
      nav { padding: 0 1.25rem; }
      .nav-links { gap: 1rem; }
      .fv-logo { width: 200px; }
      .portfolio-section { padding: 3rem 1.25rem; }
      .portfolio-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    }
  </style>
</head>

  <!-- ライトボックス -->
  <div class="lightbox" id="lightbox">
    <div class="lightbox-inner">
      <button class="lb-close" onclick="closeLightbox()">✕</button>
      <button class="lb-btn" onclick="changeImage(-1)">&#8592;</button>
      <img id="lbImg" src="" alt="">
      <button class="lb-btn" onclick="changeImage(1)">&#8594;</button>
    </div>
  </div>

  <script>
    const works = [
      { src: "images/w-0001.jpg" },
      { src: "images/w-0002.jpg" },
      { src: "images/w-0003.jpg" },
      { src: "images/w-0004.jpg" },
      { src: "images/w-0005.jpg" },
      { src: "images/w-0006.jpg" },
      { src: "images/w-0008.jpg" },
      { src: "images/w-0009.png" },
      { src: "images/w-0010.jpg" },
      { src: "images/w-0011.jpg" },
      { src: "images/w-0012.jpg" },
    ];

    const PER_PAGE = 20;
    let shown = 0;

    function renderWorks() {
      const grid = document.getElementById('portfolioGrid');
      const next = works.slice(shown, shown + PER_PAGE);
      next.forEach((w, i) => {
        const card = document.createElement('div');
        card.className = 'work-card';
        const idx = shown + i;
        card.onclick = () => openLightbox(idx);
        if (w.src) {
          card.innerHTML = `<img src="${w.src}" alt="">`;
        } else {
          card.innerHTML = `<div class="work-card-placeholder">画像をここに</div>`;
        }
        grid.appendChild(card);
      });
      shown += next.length;
      document.getElementById('moreBtn').style.display = shown < works.length ? 'block' : 'none';
    }

    function loadMore() { renderWorks(); }

    let currentIdx = 0;
    function openLightbox(idx) {
      currentIdx = idx;
      const w = works[idx];
      if (!w.src) return;
      document.getElementById('lbImg').src = w.src;
      document.getElementById('lightbox').classList.add('open');
    }
    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
    }
    function changeImage(dir) {
      let next = currentIdx + dir;
      while (next >= 0 && next < works.length && !works[next].src) next += dir;
      if (next >= 0 && next < works.length && works[next].src) {
        currentIdx = next;
        document.getElementById('lbImg').src = works[next].src;
      }
    }
    document.getElementById('lightbox').addEventListener('click', function(e) {
      if (e.target === this) closeLightbox();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowRight') changeImage(1);
      if (e.key === 'ArrowLeft') changeImage(-1);
    });

    function showSection(id, el) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      el.classList.add('active');
      if (id === 'home' && shown === 0) renderWorks();
      window.scrollTo(0, 0);
      return false;
    }

    // 初期表示時にWorksを読み込む
    renderWorks();
  </script>
